<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Orchestrator</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #dde2e8;
  --accent: #2f6fde; --ok: #1f8a4c; --warn: #b26a00; --err: #c43c3c; --code-bg: #f0f2f5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #94a0b0; --border: #2a313a;
    --accent: #6ea1ff; --ok: #4cc485; --warn: #e3a33b; --err: #ff7b7b; --code-bg: #1f252d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header .agents { color: var(--muted); font-size: 12px; margin-left: auto; }
main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; height: calc(100vh - 50px); }
@media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #list { max-height: 40vh; } }
#list { overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); }
.task { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.task:hover, .task.active { background: var(--code-bg); }
.task .row { display: flex; justify-content: space-between; gap: 8px; }
.task .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.task .model { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .prompt { margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.s-running, .s-preparing, .s-testing, .s-queued { color: var(--accent); }
.s-completed { color: var(--ok); } .s-input_required { color: var(--warn); } .s-failed, .s-cancelled { color: var(--err); }
#detail { overflow-y: auto; padding: 16px; min-width: 0; }
#detail .empty { color: var(--muted); margin-top: 20vh; text-align: center; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }
code, pre { font-family: var(--mono); font-size: 12px; }
pre { background: var(--code-bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
.question { border-color: var(--warn); }
textarea, input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--err); }
.actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
#events { font-family: var(--mono); font-size: 12px; }
.ev { display: grid; grid-template-columns: 64px 92px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.ev .t { color: var(--muted); } .ev .k { color: var(--muted); text-transform: lowercase; }
.ev .x { white-space: pre-wrap; word-break: break-word; min-width: 0; }
.ev details summary { cursor: pointer; color: var(--muted); }
.k-message .x { color: var(--text); font-family: system-ui, sans-serif; font-size: 13px; }
.k-command .k, .k-file_change .k { color: var(--accent); } .k-error .k, .k-error .x { color: var(--err); }
.k-status .x { font-weight: 600; } .k-test .k { color: var(--ok); } .k-reasoning .x { color: var(--muted); font-style: italic; }
.live { font-size: 12px; color: var(--muted); }
.live::before { content: "●"; margin-right: 4px; color: var(--ok); }
form.new { display: grid; gap: 8px; }
form.new .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
header nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 6px; }
header nav a.on { color: var(--text); background: var(--code-bg); }
#setupView { max-width: 1000px; margin: 0 auto; padding: 16px; }
#setupView[hidden], main[hidden] { display: none; }
.platform h2 .muted, .muted { color: var(--muted); font-weight: 400; }
.chip.ok { color: var(--ok); } .chip.no { color: var(--muted); } .chip.bad { color: var(--err); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
@media (max-width: 760px) { .grid2, form.new .two { grid-template-columns: 1fr; } }
label { display: block; font-size: 12px; color: var(--muted); }
label > input, label > select, label > textarea { margin-top: 2px; color: var(--text); font-size: 14px; }
details.adv summary { cursor: pointer; color: var(--muted); margin-top: 8px; }
.steps { margin-top: 8px; }
.steps .s { font-size: 13px; } .steps .s.ok::before { content: "✔ "; color: var(--ok); } .steps .s.fail::before { content: "✘ "; color: var(--err); }
.switch { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
.switch input { width: auto; }
a { color: var(--accent); }
.kv > div { min-width: 0; overflow-wrap: anywhere; }
button:disabled { opacity: .5; cursor: default; }
@media (max-width: 760px) { header { flex-wrap: wrap; } .kv { grid-template-columns: 1fr; } .kv div:nth-child(odd) { margin-top: 6px; } }
</style>
</head>
<body>
<header>
  <h1>Agent Orchestrator</h1>
  <nav><a href="#" id="navTasks">Tasks</a><a href="#setup" id="navSetup">Setup</a></nav>
  <button id="newBtn">New task</button>
  <span class="agents" id="agents"></span>
</header>
<main id="tasksView">
  <nav id="list"></nav>
  <section id="detail"><p class="empty">Select a task to watch it live.</p></section>
</main>
<section id="setupView" hidden></section>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let key = (() => { try { return localStorage.getItem("orchKey") || ""; } catch { return ""; } })();
let selected = null, source = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Orchestrator-Client": "dashboard", ...(key ? { "X-Orchestrator-Key": key } : {}) } });
  if (res.status === 401) {
    key = prompt("API key for this orchestrator:") || "";
    try { localStorage.setItem("orchKey", key); } catch {}
    return api(path, opts);
  }
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}

const chip = (s, t) => t && s === "completed" && t.testsPassed === false
  ? `<span class="chip s-input_required">completed · tests failed</span>`
  : `<span class="chip s-${s}">${s.replace("_", " ")}</span>`;
// Model actually used if known, else what was requested, else the agent's default.
const modelLabel = t => t.modelUsed || (t.model ? `${t.model} (requested)` : "agent default");
const time = ts => new Date(ts).toLocaleTimeString([], { hour12: false });

async function refreshList() {
  try {
    const tasks = await api("/api/tasks?limit=100");
    $("#list").innerHTML = tasks.length ? tasks.map(t => `
      <div class="task ${t.id === selected ? "active" : ""}" data-id="${t.id}">
        <div class="row"><span class="id">${t.id} · ${t.agent}</span>${chip(t.status, t)}</div>
        <div class="model">${esc(modelLabel(t))}</div>
        <div class="prompt">${esc(t.pendingQuestion || t.summary || t.error || t.branch || "")}</div>
      </div>`).join("") : `<p style="padding:14px;color:var(--muted)">No tasks yet.</p>`;
    $("#list").querySelectorAll(".task").forEach(el => el.onclick = () => select(el.dataset.id));
    if (selected) renderTask(await api(`/api/tasks/${selected}`), false);
  } catch (e) { console.error(e); }
}

function select(id) {
  selected = id;
  location.hash = `task=${id}`;
  $("#detail").innerHTML = `<div id="taskCard"></div><div class="card"><h2>Live activity <span class="live" id="liveState">connecting</span></h2><div id="events"></div></div>`;
  api(`/api/tasks/${id}`).then(t => renderTask(t, true)).catch(e => $("#taskCard").innerHTML = `<div class="card">${esc(e.message)}</div>`);
  follow(id);
  refreshList();
}

function renderTask(t, force) {
  const card = $("#taskCard");
  if (!card) return;
  if (!force && card.dataset.updated === t.updatedAt && card.dataset.status === t.status) return;
  if (!force && ["answer", "followup"].includes(document.activeElement?.id)) return; // Don't wipe text being typed.
  card.dataset.updated = t.updatedAt; card.dataset.status = t.status;
  card.innerHTML = `
    <div class="card">
      <h2>${esc(t.id)} ${chip(t.status, t)} <span style="color:var(--muted);font-weight:400">${esc(t.agent)} · ${esc(modelLabel(t))} · turn ${t.turns}</span></h2>
      <div class="kv">
        <div>Model</div><div><code>${esc(t.modelUsed || "—")}</code>${t.model && t.model !== t.modelUsed ? ` <span style="color:var(--muted)">(requested: ${esc(t.model)})</span>` : ""}${!t.modelUsed && ["queued","preparing","running"].includes(t.status) ? ` <span style="color:var(--muted)">detecting…</span>` : ""}</div>
        <div>Branch</div><div><code>${esc(t.branch || "—")}</code></div>
        <div>Worktree</div><div><code>${esc(t.worktreePath || "—")}</code></div>
        <div>Changes</div><div>${t.changedFileCount} file(s)${t.testsPassed == null ? "" : t.testsPassed ? " · tests passed" : " · <span style='color:var(--err)'>tests failed</span>"}</div>
        ${t.watchCommand ? `<div>Open session</div><div><code>${esc(t.watchCommand)}</code> <button data-copy="${esc(t.watchCommand)}">copy</button></div>` : ""}
      </div>
      <div class="actions">
        ${["queued","preparing","running","testing","input_required"].includes(t.status) ? `<button class="danger" id="cancel">Cancel</button>` : ""}
        ${t.patchPath ? `<a href="/api/tasks/${t.id}/patch${key ? `?key=${encodeURIComponent(key)}` : ""}"><button>Download patch</button></a>` : ""}
      </div>
    </div>
    ${t.status === "input_required" ? `
    <div class="card question">
      <h2>The agent needs a decision</h2>
      <pre>${esc(t.pendingQuestion)}</pre>
      <textarea id="answer" rows="3" placeholder="Your answer…"></textarea>
      <div class="actions"><button class="primary" id="sendAnswer">Send answer</button></div>
    </div>` : ""}
    ${t.notice ? `<div class="card"><h2>Notice</h2><pre>${esc(t.notice)}</pre></div>` : ""}
    ${t.status === "completed" && t.testsPassed === false ? `<div class="card question"><h2>Tests failed — review before merging</h2><pre>${esc(t.nextStep)}</pre></div>` : ""}
    ${t.error ? `<div class="card"><h2>Error</h2><pre>${esc(t.error)}</pre></div>` : ""}
    ${t.summary ? `<div class="card"><h2>Agent summary</h2><pre>${esc(t.summary)}</pre></div>` : ""}
    ${t.diffStat ? `<div class="card"><h2>Diff</h2><pre>${esc(t.diffStat)}</pre></div>` : ""}
    ${t.testOutputTail ? `<div class="card"><h2>Test output (tail)</h2><pre>${esc(t.testOutputTail)}</pre></div>` : ""}
    ${["completed","failed"].includes(t.status) && t.worktreePath ? `
    <div class="card"><h2>Follow-up</h2>
      <textarea id="followup" rows="2" placeholder="Ask the same agent session for more changes…"></textarea>
      <div class="actions"><button id="sendFollowup">Continue task</button></div></div>` : ""}`;
  card.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => navigator.clipboard?.writeText(b.dataset.copy));
  $("#cancel", card)?.addEventListener("click", () => api(`/api/tasks/${t.id}/cancel`, { method: "POST" }).then(refreshList));
  $("#sendAnswer", card)?.addEventListener("click", () => post(`/api/tasks/${t.id}/answer`, $("#answer").value));
  $("#sendFollowup", card)?.addEventListener("click", () => post(`/api/tasks/${t.id}/continue`, $("#followup").value));
}

async function post(path, message) {
  if (!message.trim()) return;
  try { renderTask(await api(path, { method: "POST", body: JSON.stringify({ message }) }), true); refreshList(); }
  catch (e) { alert(e.message); }
}

function follow(id) {
  source?.close();
  const box = $("#events");
  source = new EventSource(`/api/tasks/${id}/events${key ? `?key=${encodeURIComponent(key)}` : ""}`);
  source.onopen = () => { const s = $("#liveState"); if (s) s.textContent = "live"; };
  source.onerror = () => { const s = $("#liveState"); if (s) s.textContent = "reconnecting"; };
  source.addEventListener("agent-event", msg => {
    const e = JSON.parse(msg.data);
    const atBottom = box.parentElement.scrollHeight - box.parentElement.scrollTop - box.parentElement.clientHeight < 40;
    const row = document.createElement("div");
    row.className = `ev k-${e.kind}`;
    const detail = e.detail ? `<details><summary>details</summary><pre>${esc(e.detail)}</pre></details>` : "";
    row.innerHTML = `<span class="t">${time(e.timestamp)}</span><span class="k">${e.kind}</span><span class="x">${esc(e.text)}${detail}</span>`;
    box.appendChild(row);
    if (atBottom) row.scrollIntoView({ block: "end" });
    if (e.kind === "status") refreshList();
  });
}

function newTaskForm() {
  selected = null; source?.close();
  $("#detail").innerHTML = `
    <div class="card"><h2>Delegate a task</h2>
      <form class="new" id="newForm">
        <div class="two">
          <label>Agent<select name="agent" id="agentSel"></select></label>
          <label>Model (optional)<input name="model" id="modelInput" placeholder="agent default"></label>
        </div>
        <label>Repository path<input name="repoPath" placeholder="/path/to/repo" required></label>
        <label>Task brief<textarea name="prompt" rows="6" required placeholder="Goal, constraints, files, acceptance criteria"></textarea></label>
        <div class="two">
          <label>Test command (optional)<input name="testCommand" placeholder="dotnet test"></label>
          <label>Base ref (optional)<input name="baseRef" placeholder="HEAD + uncommitted"></label>
        </div>
        <div class="actions"><button class="primary">Start</button></div>
      </form></div>`;
  api("/api/agents").then(list => {
    const sel = $("#agentSel");
    // No preselected platform: the user chooses, as agents are told to ask.
    sel.required = true;
    sel.innerHTML = `<option value="">Choose a platform…</option>` + list.filter(a => a.enabled).map(a =>
      `<option value="${esc(a.name)}" ${a.available ? "" : "disabled"}>${esc(a.displayName)}${a.available ? "" : " (not installed)"}</option>`).join("");
    const hint = () => {
      const a = list.find(x => x.name === sel.value);
      $("#modelInput").placeholder = a?.model ? `default: ${a.model}` : "agent's own default";
    };
    sel.onchange = hint; hint();
  });
  $("#newForm").onsubmit = async ev => {
    ev.preventDefault();
    const body = Object.fromEntries([...new FormData(ev.target)].filter(([, v]) => v));
    try { const t = await api("/api/tasks", { method: "POST", body: JSON.stringify(body) }); select(t.id); }
    catch (e) { alert(e.message); }
  };
}

// ---------------------------------------------------------------- Setup page (#setup)
const lines = v => (v || "").split("\n").map(x => x.trim()).filter(Boolean);
const stepsHtml = r => `<div class="steps">${(r.steps || []).map(st =>
  `<div class="s ${st.ok ? "ok" : "fail"}">${esc(st.step)}${st.detail ? `<pre>${esc(st.detail)}</pre>` : ""}</div>`).join("") || "<div class='muted'>Nothing to do.</div>"}</div>`;

async function renderSetup() {
  const view = $("#setupView");
  view.innerHTML = `<div class="card"><h2>Setup</h2><p class="muted">Loading…</p></div>`;
  let info, platforms;
  try { [info, platforms] = await Promise.all([api("/api/setup/info"), api("/api/setup/platforms")]); }
  catch (e) { view.innerHTML = `<div class="card"><h2>Setup</h2><pre>${esc(e.message)}</pre></div>`; return; }
  const a = info.autostart;
  view.innerHTML = `
    <div class="card"><h2>Server <span class="muted">v${esc(info.version)}</span></h2>
      <div class="kv">
        <div>Dashboard</div><div><a href="${esc(info.urls.dashboard)}">${esc(info.urls.dashboard)}</a></div>
        <div>Setup</div><div><a href="${esc(info.urls.setup)}">${esc(info.urls.setup)}</a></div>
        <div>One task</div><div><code>${esc(info.urls.task)}</code></div>
        <div>MCP endpoint</div><div><code>${esc(info.urls.mcp)}</code> <button data-copy="${esc(info.urls.mcp)}">copy</button> <span class="muted">(for agents, not a web page)</span></div>
        <div>Data folder</div><div><code>${esc(info.dataDirectory)}</code></div>
        <div>Settings file</div><div><code>${esc(info.configFile)}</code></div>
        <div>Log file</div><div><code>${esc(info.logFile || "off")}</code></div>
      </div>
      <div class="actions">
        <label class="switch"><input type="checkbox" id="autostart" ${a.enabled ? "checked" : ""} ${a.supported && (info.installed || a.enabled) ? "" : "disabled"}>
          Start automatically when I log in <span class="muted">(${esc(a.mechanism)})</span></label>
      </div>
      ${!info.installed ? `<p class="muted">Running from a development build. Install with <code>install.ps1</code> / <code>install.sh</code> to enable autostart.</p>` : ""}
      ${a.note ? `<p class="muted">${esc(a.note)}</p>` : ""}
      <div id="autostartOut"></div>
    </div>
    <div class="card"><h2>Commands delegated agents may run</h2>
      <p class="muted" style="margin-top:0">One command prefix per line; each is allowed with any arguments (e.g. <code>dotnet</code>,
      <code>npm test</code>, <code>pytest</code>). A task's own test command is always allowed. Claude Code and Qoder refuse every other
      shell command; OpenCode allows all commands except risky git ones; Codex runs commands in its sandbox (with network access).</p>
      <textarea id="allowedCommands" rows="4">${esc((info.allowedCommands || []).join("\n"))}</textarea>
      <div class="actions"><button class="primary" id="saveAllowed">Save</button></div>
      <div id="allowedOut"></div>
    </div>
    <div class="card"><h2>Platforms</h2>
      <p class="muted" style="margin:0">Connect = register this orchestrator's MCP endpoint with the agent and install the
      <code>agent-orchestrator</code> skill, so you can say “delegate this to …” from inside that agent.
      Every connected agent asks you which platform to use for each task.</p>
    </div>
    ${platforms.map(platformCard).join("")}
    ${addPlatformCard()}`;
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => navigator.clipboard?.writeText(b.dataset.copy));
  $("#autostart").onchange = async ev => {
    const out = $("#autostartOut");
    out.innerHTML = `<p class="muted">Working…</p>`;
    try {
      const r = await api("/api/setup/autostart", { method: "POST", body: JSON.stringify({ enabled: ev.target.checked }) });
      ev.target.checked = r.enabled;
      out.innerHTML = r.note ? `<pre>${esc(r.note)}</pre>` : `<p class="muted">${r.enabled ? "Enabled" : "Disabled"} (${esc(r.location || r.mechanism)}).</p>`;
    } catch (e) { out.innerHTML = `<pre>${esc(e.message)}</pre>`; }
  };
  $("#saveAllowed").onclick = async () => {
    try {
      const r = await api("/api/setup/settings", { method: "PUT", body: JSON.stringify({ allowedCommands: lines($("#allowedCommands").value) }) });
      $("#allowedCommands").value = r.allowedCommands.join("\n");
      $("#allowedOut").innerHTML = `<p class="muted">Saved. Applies to the next agent turn${r.allowedCommands.length ? "" : " (no commands are pre-approved now)"}.</p>`;
    } catch (e) { $("#allowedOut").innerHTML = `<pre>${esc(e.message)}</pre>`; }
  };
  platforms.forEach(wirePlatform);
  wireAddPlatform();
}

function platformCard(p) {
  const mcp = p.mcpRegistered === true ? `<span class="chip ok">MCP registered</span>`
    : p.mcpRegistered === false ? `<span class="chip no">MCP not registered</span>` : `<span class="chip no">MCP: register manually</span>`;
  return `
  <div class="card platform" id="p-${esc(p.name)}">
    <h2>${esc(p.displayName)} <span class="muted"><code>${esc(p.name)}</code>${p.builtIn ? "" : " · custom"}</span>
      ${!p.enabled ? `<span class="chip bad">disabled</span>` : p.available ? `<span class="chip ok">installed</span>` : `<span class="chip bad">not installed</span>`}
      ${p.connected ? `<span class="chip ok">connected</span>` : `<span class="chip no">not connected</span>`}
    </h2>
    <div class="kv">
      <div>Program</div><div>${p.resolvedPath ? `<code>${esc(p.resolvedPath)}</code>` : `<code>${esc(p.executable)}</code> not found${p.installHint ? ` — ${esc(p.installHint)}` : ""}`}</div>
      <div>Orchestrator</div><div>${mcp} ${p.skillInstalled ? `<span class="chip ok">skill installed</span>` : `<span class="chip no">skill not installed</span>`}</div>
      ${p.protocol ? `<div>Protocol</div><div><code>${esc(p.protocol)}</code></div>` : ""}
    </div>
    <div class="grid2" style="margin-top:8px">
      <label>Default model<input data-f="model" value="${esc(p.model || "")}" placeholder="agent's own default"></label>
      <label class="switch" style="align-self:end"><input type="checkbox" data-f="enabled" ${p.enabled ? "checked" : ""}> Enabled for delegation</label>
    </div>
    <details class="adv"><summary>Advanced</summary>
      <div class="grid2" style="margin-top:6px">
        <label>Program (name on PATH or full path)<input data-f="executable" value="${esc(p.executable)}"></label>
        <label>Permission policy / extra arguments (one per line)<textarea data-f="extraArgs" rows="4">${esc((p.extraArgs || []).join("\n"))}</textarea></label>
      </div>
      <div class="actions"><button data-a="reset">Reset arguments to default</button></div>
      <div class="muted" style="margin-top:4px">Skill files: ${(p.skillFiles || []).map(f => `<code>${esc(f)}</code>`).join(", ") || "none"}</div>
    </details>
    <div class="actions">
      <button class="primary" data-a="connect" ${p.canConnect ? "" : "disabled title='No integration defined'"}>${p.connected ? "Reconnect" : "Connect"}</button>
      <button data-a="disconnect">Disconnect</button>
      <button data-a="check">Check</button>
      <button data-a="save">Save settings</button>
      ${p.builtIn ? "" : `<button class="danger" data-a="remove">Remove platform</button>`}
    </div>
    <div class="out"></div>
  </div>`;
}

function wirePlatform(p) {
  const card = $(`#p-${CSS.escape(p.name)}`);
  const out = $(".out", card);
  const field = f => $(`[data-f="${f}"]`, card);
  const run = async (fn, label) => {
    card.querySelectorAll("button").forEach(b => b.disabled = true);
    out.innerHTML = `<p class="muted">${label}…</p>`;
    try { const r = await fn(); return r; }
    catch (e) { out.innerHTML = `<pre>${esc(e.message)}</pre>`; card.querySelectorAll("button").forEach(b => b.disabled = false); }
  };
  const action = async (a, label) => {
    const r = await run(() => api(`/api/setup/platforms/${encodeURIComponent(p.name)}/${a}`, { method: "POST" }), label);
    if (!r) return;
    if (a === "check") { out.innerHTML = stepsHtml(r); card.querySelectorAll("button").forEach(b => b.disabled = false); return; }
    await renderSetup();
    const again = $(`#p-${CSS.escape(p.name)} .out`);
    if (again) again.innerHTML = stepsHtml(r);
  };
  card.querySelector('[data-a="connect"]').onclick = () => action("connect", "Connecting");
  card.querySelector('[data-a="disconnect"]').onclick = () => action("disconnect", "Disconnecting");
  card.querySelector('[data-a="check"]').onclick = () => action("check", "Checking");
  card.querySelector('[data-a="save"]').onclick = async () => {
    const extra = lines(field("extraArgs").value);
    const same = JSON.stringify(extra) === JSON.stringify(p.extraArgs || []);
    const body = { enabled: field("enabled").checked, model: field("model").value, executable: field("executable").value, ...(same ? {} : { extraArgs: extra }) };
    if (await run(() => api(`/api/setup/platforms/${encodeURIComponent(p.name)}`, { method: "PUT", body: JSON.stringify(body) }), "Saving")) {
      await renderSetup();
      const again = $(`#p-${CSS.escape(p.name)} .out`);
      if (again) again.innerHTML = `<p class="muted">Saved to your settings file. Applies to new tasks.</p>`;
    }
  };
  card.querySelector('[data-a="reset"]').onclick = async () => {
    if (await run(() => api(`/api/setup/platforms/${encodeURIComponent(p.name)}`, { method: "PUT", body: JSON.stringify({ resetExtraArgs: true }) }), "Resetting")) {
      await renderSetup();
      const again = $(`#p-${CSS.escape(p.name)} .out`);
      if (again) again.innerHTML = `<p class="muted">Arguments reset to the built-in defaults.</p>`;
    }
  };
  card.querySelector('[data-a="remove"]')?.addEventListener("click", async () => {
    if (!confirm(`Remove ${p.displayName}? This disconnects it and deletes its settings.`)) return;
    if (await run(() => api(`/api/setup/platforms/${encodeURIComponent(p.name)}`, { method: "DELETE" }), "Removing")) renderSetup();
  });
}

    Use <b>Check</b> afterwards to confirm the program runs. If its output looks like Claude Code's <code>stream-json</code>,
    choose that protocol to get a live activity feed; otherwise <code>text</code> works with any CLI (final output only, no resume).</p>
    <form class="new" id="addForm">
      <div class="two">
        <label>Name (lowercase, used as <code>agent</code>)<input name="name" required pattern="[a-z0-9][a-z0-9\\-]{0,31}" placeholder="gemini"></label>
        <label>Display name<input name="displayName" placeholder="Gemini CLI"></label>
      </div>
      <div class="two">
        <label>Program (name on PATH or full path)<input name="executable" required placeholder="gemini"></label>

          <option value="claude-stream-json">claude-stream-json (Claude Code / Qoder style)</option>
          <option value="codex-jsonl">codex-jsonl (codex exec --json style)</option>

      </div>
      <div class="two">
        <label>Arguments for one turn (one per line; <code>{prompt}</code> optional)<textarea name="args" rows="3" placeholder="-p"></textarea></label>
        <label>Prompt passed via<select name="promptVia"><option value="stdin">stdin</option><option value="arg">last argument / {prompt}</option></select></label>
      </div>
      <div class="two">
        <label>Model arguments (one per line, <code>{model}</code>)<textarea name="modelArgs" rows="2" placeholder="--model&#10;{model}"></textarea></label>
        <label>Resume arguments (one per line, <code>{sessionId}</code>; empty = no resume)<textarea name="resumeArgs" rows="2" placeholder="--resume&#10;{sessionId}"></textarea></label>
      </div>
      <div class="two">
        <label>Permission policy / extra arguments (one per line)<textarea name="extraArgs" rows="2"></textarea></label>
        <label>Default model<input name="model" placeholder="agent's own default"></label>
      </div>
      <details class="adv"><summary>Connect settings (so this agent can delegate too)</summary>
        <div class="two" style="margin-top:6px">
          <label>Command that registers the MCP server (one item per line; <code>{url}</code>)<textarea name="mcpAdd" rows="3" placeholder="gemini&#10;mcp&#10;add&#10;orchestrator&#10;{url}"></textarea></label>
          <label>Command that removes it<textarea name="mcpRemove" rows="3" placeholder="gemini&#10;mcp&#10;remove&#10;orchestrator"></textarea></label>
        </div>
        <div class="two">
          <label>Skill folders (one per line, <code>~</code> = home)<textarea name="skillsDirs" rows="2" placeholder="~/.gemini/skills"></textarea></label>
          <label>Install hint shown when missing<input name="installHint" placeholder="npm i -g …"></label>
        </div>
        <label>Version check arguments (one per line, default <code>--version</code>)<textarea name="versionArgs" rows="1"></textarea></label>
      </details>
      <div class="actions"><button class="primary">Add platform</button></div>
      <div id="addOut"></div>
    </form>
  </div>`;
}

function wireAddPlatform() {
  $("#addForm").onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const body = {
      name: f.name.trim().toLowerCase(), displayName: f.displayName, executable: f.executable, protocol: f.protocol,
      promptVia: f.promptVia, model: f.model, installHint: f.installHint,
      args: lines(f.args), modelArgs: lines(f.modelArgs), resumeArgs: lines(f.resumeArgs), extraArgs: lines(f.extraArgs),
      versionArgs: lines(f.versionArgs),
      integration: { mcpAdd: lines(f.mcpAdd), mcpRemove: lines(f.mcpRemove), skillsDirs: lines(f.skillsDirs) },
    };
    try {
      const p = await api("/api/setup/platforms", { method: "POST", body: JSON.stringify(body) });
      await renderSetup();
      const card = $(`#p-${CSS.escape(p.name)}`);
      card?.scrollIntoView({ block: "center" });
      if (card) $(".out", card).innerHTML = `<p class="muted">Added. Click <b>Check</b> to verify the program runs${p.canConnect ? ", then <b>Connect</b>" : ""}.</p>`;
    } catch (e) { $("#addOut").innerHTML = `<pre>${esc(e.message)}</pre>`; }
  };
}

// ---------------------------------------------------------------- routing
function route() {
  const setup = location.hash === "#setup";
  $("#tasksView").hidden = setup;
  $("#setupView").hidden = !setup;
  $("#newBtn").hidden = setup;
  $("#navTasks").classList.toggle("on", !setup);
  $("#navSetup").classList.toggle("on", setup);
  if (setup) { renderSetup(); return; }
  const fromHash = location.hash.match(/task=([\w-]+)/);
  if (fromHash && fromHash[1] !== selected) select(fromHash[1]);
}

$("#newBtn").onclick = newTaskForm;
api("/api/agents").then(list => $("#agents").textContent = list.map(a => `${a.name}: ${a.available ? "ready" : a.enabled ? "not installed" : "disabled"}`).join(" · ")).catch(() => {});
window.addEventListener("hashchange", route);
route();
refreshList();
setInterval(() => { if (location.hash !== "#setup") refreshList(); }, 4000);
</script>
